<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NutriSnap</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f5fff8;
      color: #173d2b;
    }

    .app {
      max-width: 480px;
      margin: auto;
      padding: 24px;
      padding-bottom: 80px;
    }

    h1 {
      margin-bottom: 4px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .profile img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }

    .status {
      font-size: 14px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-top: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .calories {
      font-size: 38px;
      font-weight: bold;
      margin: 8px 0;
    }

    .macros {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .macro {
      text-align: center;
      flex: 1;
    }

    .macro b {
      font-size: 20px;
    }

    button {
      width: 100%;
      border: none;
      padding: 16px;
      margin-top: 14px;
      border-radius: 16px;
      background: #20b26b;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #dfe9e3;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    #foodInput {
      display: none;
    }

    #previewCard {
      display: none;
    }

    #foodPreview {
      width: 100%;
      margin-top: 12px;
      border-radius: 16px;
      max-height: 320px;
      object-fit: cover;
    }

    .result {
      margin-top: 14px;
      font-weight: bold;
    }

    .meal {
      padding: 14px 0;
      border-bottom: 1px solid #edf2ef;
    }

    .meal:last-child {
      border-bottom: none;
    }

    .meal-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .meal-name {
      font-weight: bold;
    }

    .meal-kcal {
      white-space: nowrap;
      font-weight: bold;
    }

    .meal-detail {
      font-size: 14px;
      opacity: 0.7;
      margin-top: 5px;
    }

    .empty {
      text-align: center;
      padding: 20px 0;
      opacity: 0.65;
    }

    .loading {
      opacity: 0.6;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>NutriSnap 🥗</h1>

  <div class="profile">

    <img id="profileImage" alt="LINE profile">

    <div>
      <div id="welcome">
        กำลังเชื่อมต่อ LINE...
      </div>

      <div
        class="status"
        id="status"
      ></div>
    </div>

  </div>


  <!-- Dashboard -->
  <div class="card">

    <div>พลังงานวันนี้</div>

    <div
      class="calories"
      id="totalCalories"
    >
      0 kcal
    </div>

    <div class="status">
      เป้าหมายรายวัน: ยังไม่ได้ตั้ง
    </div>

    <div class="macros">

      <div class="macro">
        <b id="totalProtein">0g</b>
        <br>
        โปรตีน
      </div>

      <div class="macro">
        <b id="totalCarbs">0g</b>
        <br>
        คาร์บ
      </div>

      <div class="macro">
        <b id="totalFat">0g</b>
        <br>
        ไขมัน
      </div>

    </div>

  </div>


  <!-- Camera -->
  <input
    type="file"
    id="foodInput"
    accept="image/*"
    capture="environment"
  >

  <button onclick="openCamera()">
    📷 ถ่ายรูปอาหาร
  </button>


  <div
    class="card"
    id="previewCard"
  >
    <h3>รูปอาหาร</h3>

    <img
      id="foodPreview"
      alt="รูปอาหาร"
    >
  </div>


  <!-- Add meal -->
  <div class="card">

    <h3>บันทึกอาหาร</h3>

    <input
      id="foodName"
      type="text"
      placeholder="ชื่ออาหาร เช่น ข้าวมันไก่"
    >

    <select id="mealType">
      <option value="breakfast">
        มื้อเช้า
      </option>

      <option value="lunch">
        มื้อกลางวัน
      </option>

      <option value="dinner">
        มื้อเย็น
      </option>

      <option value="snack">
        ของว่าง
      </option>
    </select>

    <input
      id="calories"
      type="number"
      placeholder="แคลอรี่ (kcal)"
    >

    <div class="grid">

      <input
        id="protein"
        type="number"
        placeholder="โปรตีน (g)"
      >

      <input
        id="carbs"
        type="number"
        placeholder="คาร์บ (g)"
      >

      <input
        id="fat"
        type="number"
        placeholder="ไขมัน (g)"
      >

      <input
        id="sugar"
        type="number"
        placeholder="น้ำตาล (g)"
      >

      <input
        id="fiber"
        type="number"
        placeholder="ใยอาหาร (g)"
      >

      <input
        id="sodium"
        type="number"
        placeholder="โซเดียม (mg)"
      >

    </div>


    <button
      id="saveButton"
      onclick="saveMeal()"
    >
      💾 บันทึกมื้อนี้
    </button>

    <div
      class="result"
      id="saveResult"
    ></div>

  </div>


  <!-- Today's meals -->
  <div class="card">

    <h3>อาหารวันนี้</h3>

    <div
      id="mealList"
      class="loading"
    >
      กำลังโหลด...
    </div>

  </div>

</div>


<script>

const SAVE_MEAL_URL =
  "https://cvzmuehsizldprlroysk.supabase.co/functions/v1/save-meal";

const GET_MEALS_URL =
  "https://cvzmuehsizldprlroysk.supabase.co/functions/v1/dynamic-handler";


let selectedFoodFile = null;


/* ------------------------
   LINE LOGIN
------------------------- */

async function startLIFF() {

  const welcome =
    document.getElementById("welcome");

  const status =
    document.getElementById("status");

  const profileImage =
    document.getElementById("profileImage");

  try {

    await liff.init({
      liffId:
        "2011496157-E8nRBs0g"
    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;
    }


    const profile =
      await liff.getProfile();


    welcome.textContent =
      "สวัสดี " +
      profile.displayName +
      " 👋";


    status.textContent =
      "เชื่อมต่อบัญชี LINE แล้ว";


    if (profile.pictureUrl) {

      profileImage.src =
        profile.pictureUrl;

      profileImage.style.display =
        "block";
    }


    await loadTodayMeals();


  } catch (error) {

    console.error(error);

    status.textContent =
      "เชื่อมต่อ LINE ไม่สำเร็จ";
  }
}


/* ------------------------
   CAMERA
------------------------- */

function openCamera() {

  document
    .getElementById("foodInput")
    .click();
}


document
  .getElementById("foodInput")
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      selectedFoodFile =
        file;


      const preview =
        document.getElementById(
          "foodPreview"
        );


      preview.src =
        URL.createObjectURL(file);


      document
        .getElementById(
          "previewCard"
        )
        .style.display =
        "block";
    }
  );


function getValue(id) {

  return document
    .getElementById(id)
    .value;
}


/* ------------------------
   SAVE MEAL
------------------------- */

async function saveMeal() {

  const result =
    document.getElementById(
      "saveResult"
    );


  const button =
    document.getElementById(
      "saveButton"
    );


  const foodName =
    getValue("foodName")
      .trim();


  if (!foodName) {

    result.textContent =
      "กรุณาใส่ชื่ออาหารก่อน";

    return;
  }


  try {

    button.disabled =
      true;


    button.textContent =
      "กำลังบันทึก...";


    result.textContent =
      "";


    const accessToken =
      liff.getAccessToken();


    if (!accessToken) {

      throw new Error(
        "ไม่พบ LINE access token"
      );
    }


    const formData =
      new FormData();


    formData.append(
      "food_name",
      foodName
    );


    formData.append(
      "meal_type",
      getValue("mealType")
    );


    const fields = [
      "calories",
      "protein",
      "carbs",
      "fat",
      "sugar",
      "fiber",
      "sodium"
    ];


    fields.forEach(
      (field) => {

        const value =
          getValue(field);


        if (value !== "") {

          formData.append(
            field,
            value
          );
        }
      }
    );


    if (selectedFoodFile) {

      formData.append(
        "image",
        selectedFoodFile,
        selectedFoodFile.name
      );
    }


    const response =
      await fetch(
        SAVE_MEAL_URL,
        {
          method: "POST",

          headers: {
            Authorization:
              "Bearer " +
              accessToken
          },

          body: formData
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "บันทึกไม่สำเร็จ"
      );
    }


    result.textContent =
      "✅ บันทึก " +
      foodName +
      " เรียบร้อยแล้ว";


    clearMealForm();


    /*
      สำคัญ:
      บันทึกเสร็จแล้ว
      โหลด Dashboard ใหม่ทันที
    */

    await loadTodayMeals();


  } catch (error) {

    console.error(error);


    result.textContent =
      "❌ " +
      error.message;


  } finally {

    button.disabled =
      false;


    button.textContent =
      "💾 บันทึกมื้อนี้";
  }
}


/* ------------------------
   LOAD TODAY
------------------------- */

async function loadTodayMeals() {

  const mealList =
    document.getElementById(
      "mealList"
    );


  try {

    mealList.classList.add(
      "loading"
    );


    mealList.textContent =
      "กำลังโหลด...";


    const accessToken =
      liff.getAccessToken();


    if (!accessToken) {

      throw new Error(
        "ไม่พบ LINE access token"
      );
    }


    const response =
      await fetch(
        GET_MEALS_URL,
        {
          method: "GET",

          headers: {
            Authorization:
              "Bearer " +
              accessToken
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "โหลดข้อมูลไม่สำเร็จ"
      );
    }


    updateDashboard(
      data.totals
    );


    renderMeals(
      data.meals
    );


  } catch (error) {

    console.error(error);


    mealList.textContent =
      "โหลดรายการอาหารไม่ได้: " +
      error.message;


  } finally {

    mealList.classList.remove(
      "loading"
    );
  }
}


/* ------------------------
   UPDATE TOTALS
------------------------- */

function updateDashboard(
  totals = {}
) {

  const calories =
    Number(
      totals.calories || 0
    );


  const protein =
    Number(
      totals.protein || 0
    );


  const carbs =
    Number(
      totals.carbs || 0
    );


  const fat =
    Number(
      totals.fat || 0
    );


  document
    .getElementById(
      "totalCalories"
    )
    .textContent =
      roundNumber(calories) +
      " kcal";


  document
    .getElementById(
      "totalProtein"
    )
    .textContent =
      roundNumber(protein) +
      "g";


  document
    .getElementById(
      "totalCarbs"
    )
    .textContent =
      roundNumber(carbs) +
      "g";


  document
    .getElementById(
      "totalFat"
    )
    .textContent =
      roundNumber(fat) +
      "g";
}


/* ------------------------
   RENDER MEALS
------------------------- */

function renderMeals(
  meals = []
) {

  const container =
    document.getElementById(
      "mealList"
    );


  container.innerHTML =
    "";


  if (!meals.length) {

    container.innerHTML =
      `
      <div class="empty">
        วันนี้ยังไม่มีรายการอาหาร 🍽️
      </div>
      `;

    return;
  }


  meals.forEach(
    (meal) => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "meal";


      const mealName =
        escapeHtml(
          meal.food_name ||
          "ไม่ระบุชื่อ"
        );


      const mealType =
        mealTypeThai(
          meal.meal_type
        );


      const calories =
        roundNumber(
          meal.calories || 0
        );


      const protein =
        roundNumber(
          meal.protein || 0
        );


      const carbs =
        roundNumber(
          meal.carbs || 0
        );


      const fat =
        roundNumber(
          meal.fat || 0
        );


      div.innerHTML =
        `
        <div class="meal-top">

          <div>
            <div class="meal-name">
              ${mealName}
            </div>

            <div class="meal-detail">
              ${mealType}
            </div>
          </div>

          <div class="meal-kcal">
            ${calories} kcal
          </div>

        </div>

        <div class="meal-detail">
          โปรตีน ${protein}g
          · คาร์บ ${carbs}g
          · ไขมัน ${fat}g
        </div>
        `;


      container.appendChild(
        div
      );
    }
  );
}


/* ------------------------
   HELPERS
------------------------- */

function mealTypeThai(type) {

  const names = {
    breakfast:
      "🌅 มื้อเช้า",

    lunch:
      "☀️ มื้อกลางวัน",

    dinner:
      "🌙 มื้อเย็น",

    snack:
      "🍪 ของว่าง"
  };


  return (
    names[type] ||
    "🍽️ มื้ออาหาร"
  );
}


function roundNumber(value) {

  const number =
    Number(value || 0);


  return Math.round(
    number * 10
  ) / 10;
}


function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    value;


  return div.innerHTML;
}


function clearMealForm() {

  document
    .getElementById(
      "foodName"
    )
    .value =
      "";


  const fields = [
    "calories",
    "protein",
    "carbs",
    "fat",
    "sugar",
    "fiber",
    "sodium"
  ];


  fields.forEach(
    (field) => {

      document
        .getElementById(field)
        .value =
          "";
    }
  );


  selectedFoodFile =
    null;


  document
    .getElementById(
      "foodInput"
    )
    .value =
      "";


  document
    .getElementById(
      "previewCard"
    )
    .style.display =
      "none";
}


startLIFF();

</script>

</body>
</html>
