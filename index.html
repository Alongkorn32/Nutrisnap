<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriSnap</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f5fff8;
      color: #173d2b;
    }

    .app {
      max-width: 480px;
      margin: auto;
      padding: 24px;
    }

    .header {
      margin-top: 20px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .profile img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }

    h1 {
      margin-bottom: 4px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-top: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .calories {
      font-size: 36px;
      font-weight: bold;
      margin: 8px 0;
    }

    .macros {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
    }

    .macro {
      text-align: center;
      flex: 1;
    }

    button {
      width: 100%;
      border: none;
      padding: 16px;
      margin-top: 18px;
      border-radius: 16px;
      background: #20b26b;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .meal {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .status {
      font-size: 14px;
      opacity: 0.7;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="header">
      <h1>NutriSnap 🥗</h1>

      <div class="profile">
        <img id="profileImage" alt="LINE profile">
        <div>
          <div id="welcome">กำลังเชื่อมต่อ LINE...</div>
          <div class="status" id="status"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div>พลังงานวันนี้</div>
      <div class="calories">1,420 kcal</div>
      <div>เป้าหมาย 2,000 kcal</div>

      <div class="macros">
        <div class="macro">
          <b>72g</b><br>
          โปรตีน
        </div>

        <div class="macro">
          <b>155g</b><br>
          คาร์บ
        </div>

        <div class="macro">
          <b>48g</b><br>
          ไขมัน
        </div>
      </div>
    </div>

    <button onclick="alert('ขั้นต่อไปเราจะทำให้ปุ่มนี้ถ่ายรูปได้จริง')">
      📷 ถ่ายรูปอาหาร
    </button>

    <div class="card">
      <h3>อาหารวันนี้</h3>

      <div class="meal">
        🍳 มื้อเช้า<br>
        ไข่ + ข้าว — 420 kcal
      </div>

      <div class="meal">
        🍛 มื้อกลางวัน<br>
        กะเพราไก่ — 620 kcal
      </div>
    </div>

  </div>

  <script>
    async function startLIFF() {
      const welcome = document.getElementById("welcome");
      const status = document.getElementById("status");
      const profileImage = document.getElementById("profileImage");

      try {
        await liff.init({
          liffId: "2011496157-E8nRBs0g"
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();

        welcome.textContent = "สวัสดี " + profile.displayName + " 👋";
        status.textContent = "เชื่อมต่อบัญชี LINE แล้ว";

        if (profile.pictureUrl) {
          profileImage.src = profile.pictureUrl;
          profileImage.style.display = "block";
        }

        console.log("LINE User ID:", profile.userId);

      } catch (error) {
        console.error(error);
        welcome.textContent = "NutriSnap";
        status.textContent = "เชื่อมต่อ LINE ไม่สำเร็จ";
      }
    }

    startLIFF();
  </script>
</body>
</html>
