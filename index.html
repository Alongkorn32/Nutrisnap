<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriSnap</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f5fff8;
      color: #173d2b;
    }

    .app {
      max-width: 480px;
      margin: auto;
      padding: 24px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .profile img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }

    h1 {
      margin-bottom: 4px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-top: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .calories {
      font-size: 36px;
      font-weight: bold;
      margin: 8px 0;
    }

    .macros {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
    }

    .macro {
      text-align: center;
      flex: 1;
    }

    button {
      width: 100%;
      border: none;
      padding: 16px;
      margin-top: 14px;
      border-radius: 16px;
      background: #20b26b;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #dfe9e3;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    #foodInput {
      display: none;
    }

    #previewCard {
      display: none;
    }

    #foodPreview {
      width: 100%;
      margin-top: 12px;
      border-radius: 16px;
      max-height: 320px;
      object-fit: cover;
    }

    .status {
      font-size: 14px;
      opacity: 0.7;
      margin-top: 5px;
    }

    .result {
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>
<div class="app">

  <h1>NutriSnap 🥗</h1>

  <div class="profile">
    <img id="profileImage">
    <div>
      <div id="welcome">กำลังเชื่อมต่อ LINE...</div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="card">
    <div>พลังงานวันนี้</div>
    <div class="calories">1,420 kcal</div>
    <div>เป้าหมาย 2,000 kcal</div>

    <div class="macros">
      <div class="macro"><b>72g</b><br>โปรตีน</div>
      <div class="macro"><b>155g</b><br>คาร์บ</div>
      <div class="macro"><b>48g</b><br>ไขมัน</div>
    </div>
  </div>

  <input
    type="file"
    id="foodInput"
    accept="image/*"
    capture="environment"
  >

  <button onclick="openCamera()">📷 ถ่ายรูปอาหาร</button>

  <div class="card" id="previewCard">
    <h3>รูปอาหาร</h3>
    <img id="foodPreview">
  </div>

  <div class="card">
    <h3>บันทึกอาหาร</h3>

    <input
      id="foodName"
      type="text"
      placeholder="ชื่ออาหาร เช่น ข้าวมันไก่"
    >

    <select id="mealType">
      <option value="breakfast">มื้อเช้า</option>
      <option value="lunch">มื้อกลางวัน</option>
      <option value="dinner">มื้อเย็น</option>
      <option value="snack">ของว่าง</option>
    </select>

    <input
      id="calories"
      type="number"
      placeholder="แคลอรี่ (kcal)"
    >

    <div class="grid">
      <input id="protein" type="number" placeholder="โปรตีน (g)">
      <input id="carbs" type="number" placeholder="คาร์บ (g)">
      <input id="fat" type="number" placeholder="ไขมัน (g)">
      <input id="sugar" type="number" placeholder="น้ำตาล (g)">
      <input id="fiber" type="number" placeholder="ใยอาหาร (g)">
      <input id="sodium" type="number" placeholder="โซเดียม (mg)">
    </div>

    <button id="saveButton" onclick="saveMeal()">
      💾 บันทึกมื้อนี้
    </button>

    <div class="result" id="saveResult"></div>
  </div>

</div>

<script>
  const FUNCTION_URL =
    "https://cvzmuehsizldprlroysk.supabase.co/functions/v1/save-meal";

  async function startLIFF() {
    const welcome = document.getElementById("welcome");
    const status = document.getElementById("status");
    const profileImage = document.getElementById("profileImage");

    try {
      await liff.init({
        liffId: "2011496157-E8nRBs0g"
      });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();

      welcome.textContent =
        "สวัสดี " + profile.displayName + " 👋";

      status.textContent =
        "เชื่อมต่อบัญชี LINE แล้ว";

      if (profile.pictureUrl) {
        profileImage.src = profile.pictureUrl;
        profileImage.style.display = "block";
      }

    } catch (error) {
      console.error(error);
      status.textContent = "เชื่อมต่อ LINE ไม่สำเร็จ";
    }
  }

  function openCamera() {
    document.getElementById("foodInput").click();
  }

  document
    .getElementById("foodInput")
    .addEventListener("change", function(event) {

      const file = event.target.files[0];
      if (!file) return;

      const preview =
        document.getElementById("foodPreview");

      preview.src = URL.createObjectURL(file);

      document.getElementById(
        "previewCard"
      ).style.display = "block";
    });

  function numberOrNull(id) {
    const value =
      document.getElementById(id).value;

    if (value === "") return null;

    return Number(value);
  }

  async function saveMeal() {
    const result =
      document.getElementById("saveResult");

    const button =
      document.getElementById("saveButton");

    const foodName =
      document.getElementById("foodName")
        .value.trim();

    if (!foodName) {
      result.textContent =
        "กรุณาใส่ชื่ออาหารก่อน";
      return;
    }

    try {
      button.disabled = true;
      button.textContent = "กำลังบันทึก...";
      result.textContent = "";

      const accessToken =
        liff.getAccessToken();

      if (!accessToken) {
        throw new Error(
          "ไม่พบ LINE access token"
        );
      }

      const meal = {
        food_name: foodName,

        meal_type:
          document.getElementById(
            "mealType"
          ).value,

        calories:
          numberOrNull("calories"),

        protein:
          numberOrNull("protein"),

        carbs:
          numberOrNull("carbs"),

        fat:
          numberOrNull("fat"),

        sugar:
          numberOrNull("sugar"),

        fiber:
          numberOrNull("fiber"),

        sodium:
          numberOrNull("sodium"),

        image_url: null
      };

      const response = await fetch(
        FUNCTION_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + accessToken
          },

          body: JSON.stringify(meal)
        }
      );

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.error ||
          "บันทึกข้อมูลไม่สำเร็จ"
        );
      }

      result.textContent =
        "✅ บันทึก " +
        foodName +
        " เรียบร้อยแล้ว";

      document.getElementById(
        "foodName"
      ).value = "";

      document.getElementById(
        "calories"
      ).value = "";

      document.getElementById(
        "protein"
      ).value = "";

      document.getElementById(
        "carbs"
      ).value = "";

      document.getElementById(
        "fat"
      ).value = "";

      document.getElementById(
        "sugar"
      ).value = "";

      document.getElementById(
        "fiber"
      ).value = "";

      document.getElementById(
        "sodium"
      ).value = "";

    } catch (error) {
      console.error(error);

      result.textContent =
        "❌ " + error.message;

    } finally {
      button.disabled = false;
      button.textContent =
        "💾 บันทึกมื้อนี้";
    }
  }

  startLIFF();
</script>

</body>
</html>
